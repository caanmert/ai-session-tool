version: 2
project_name: ais

before:
  hooks:
    - sh scripts/completions.sh

builds:
  - main: ./cmd/ais
    binary: ais
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - docs/USAGE.md
      - docs/RELEASING.md
      - docs/screenshots/*
      - src: build/completions/*
        dst: completions
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]
