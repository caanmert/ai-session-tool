name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_ENABLED: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate verified Homebrew formula
        run: python3 scripts/homebrew.py --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-formula
          path: dist/homebrew/ais.rb
          if-no-files-found: error
      - name: Attach formula to release
        run: gh release upload "$GITHUB_REF_NAME" dist/homebrew/ais.rb --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check out Homebrew tap
        if: env.HOMEBREW_TAP_ENABLED == 'true' && !contains(github.ref_name, '-')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: caanmert/homebrew-tap
          path: dist/tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Update Homebrew tap
        if: env.HOMEBREW_TAP_ENABLED == 'true' && !contains(github.ref_name, '-')
        working-directory: dist/tap
        run: |
          mkdir -p Formula
          cp ../homebrew/ais.rb Formula/ais.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/ais.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update ais to $GITHUB_REF_NAME"
            git push
          fi
      - name: Homebrew publishing status
        if: env.HOMEBREW_TAP_ENABLED != 'true'
        run: echo 'Formula attached to the release. Set HOMEBREW_TAP_TOKEN to publish it to caanmert/homebrew-tap automatically.'
