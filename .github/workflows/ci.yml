name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: npm ci
        working-directory: desktop/frontend
      - run: npm test
        working-directory: desktop/frontend
      - run: npm run build
        working-directory: desktop/frontend
      - run: go vet ./...
        working-directory: desktop
      - run: go test -race ./...
        working-directory: desktop
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
        working-directory: desktop
      - run: sh scripts/build-desktop.sh -s
      - name: Package app
        # Artifact uploads drop file permissions, including the app's executable
        # bit, so zip with ditto, which keeps them along with the signature.
        run: |
          app=desktop/build/bin/ais-desktop.app
          test "$(lipo -archs "$app/Contents/MacOS/ais-desktop")" = arm64
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" ais-desktop-macos-arm64.zip
      - name: Verify extracted desktop artifact
        run: python3 scripts/verify_desktop.py ais-desktop-macos-arm64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ais-desktop-macos-arm64
          path: ais-desktop-macos-arm64.zip
          if-no-files-found: error

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: python3 -m unittest discover -s scripts -v
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: Check release contents
        run: |
          for archive in dist/ais_*.tar.gz; do
            tar -tzf "$archive" > dist/archive-files.txt
            grep -Fx 'ais' dist/archive-files.txt
            grep -Fx 'completions/ais.bash' dist/archive-files.txt
            grep -Fx 'completions/ais.zsh' dist/archive-files.txt
            grep -Fx 'completions/ais.fish' dist/archive-files.txt
            grep -Fx 'docs/USAGE.md' dist/archive-files.txt
          done
      - name: Validate formula against snapshot archives
        run: |
          version="$(python3 -c 'import json; print(json.load(open("dist/metadata.json"))["version"])')"
          python3 scripts/homebrew.py --tag "v$version"
          ruby -c dist/homebrew/ais.rb
      - name: Smoke-install the packaged CLI with fixtures
        run: python3 scripts/smoke_cli.py --dist dist --fixtures testdata

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.5
